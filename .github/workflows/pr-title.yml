name: PR title

# Pull requests are squash-merged with their title as the commit message, and release-please reads
# those messages to pick the next version and write CHANGELOG.md. This keeps every title in
# Conventional Commits form: "<type>(<scope>): <summary>". See CONTRIBUTING.md.
on:
    pull_request:
        # "edited" re-runs the check when the title changes; "synchronize" reports it on new commits.
        types: [opened, edited, reopened, synchronize]

permissions:
    pull-requests: read

jobs:
    # "title" is a required status check on main; keep this job name in sync with the ruleset.
    title:
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  # Breaking change? Add "!" after the type, e.g. "feat!: drop support for X".
                  subjectPattern: ^(?![A-Z]).+$
                  subjectPatternError: |
                      The subject "{subject}" in the PR title "{title}" should start with a lowercase letter.
