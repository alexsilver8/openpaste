name: Release

# release-please keeps a release pull request open that bumps the version in package.json and adds
# the next section to CHANGELOG.md, worked out from the titles merged since the last release.
# Merging it creates a draft GitHub release and its tag. The installers are then built on macOS,
# Windows and Linux and attached to the draft, which is published only if all three builds succeed.
# Without signing secrets, macOS builds are ad-hoc signed and Windows builds are unsigned.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# One run at a time, so two quick merges don't race to update the release pull request.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  # A personal access token in RELEASE_PLEASE_TOKEN lets the checks run on the release
                  # pull request. GITHUB_TOKEN works too, but pull requests it opens don't trigger workflows.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    build:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: --mac
                    - os: windows-latest
                      target: --win
                    - os: ubuntu-latest
                      target: --linux
        runs-on: ${{ matrix.os }}
        steps:
            # Checks out the merged release pull request, the commit the release is tagged on.
            - uses: actions/checkout@v4
            - uses: pnpm/setup@v3
              with:
                  runtime: node@22
                  cache: true
                  require-lockfile: true
            - run: pnpm test
            - run: pnpm build
            - name: Build installers
              shell: bash
              run: |
                  # Secrets that aren't set arrive as empty strings, which electron-builder treats as set
                  # (an empty CSC_LINK makes it try to load the project folder as a certificate).
                  for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                    if [ -z "${!name}" ]; then unset "$name"; fi
                  done
                  args=(${{ matrix.target }} --publish never)
                  # With no Developer ID certificate, ad-hoc sign macOS builds. Unsigned Apple Silicon apps
                  # fail with "OpenPaste is damaged"; ad-hoc signed ones get the usual Open Anyway prompt.
                  if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then args+=(-c.mac.identity=-); fi
                  pnpm exec electron-builder "${args[@]}"
              env:
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            - uses: actions/upload-artifact@v4
              with:
                  name: openpaste-${{ matrix.os }}
                  path: |
                      dist/*.dmg
                      dist/*.zip
                      dist/*.exe
                      dist/*.AppImage
                      dist/*.deb
                  if-no-files-found: error

    publish:
        needs: [release-please, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true
            # Attach first, then publish, so the latest release never shows up without installers.
            - name: Attach the installers and publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.release-please.outputs.tag_name }}
                  VERSION: ${{ needs.release-please.outputs.version }}
              run: |
                  gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
                  gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenPaste $VERSION" --draft=false --latest
