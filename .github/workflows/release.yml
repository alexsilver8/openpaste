name: Release

# Publishes a GitHub release whenever main has a package.json version that hasn't been released
# yet. `pnpm release` opens the pull request that bumps the version; merging it lands here.
# Builds run on macOS, Windows and Linux; the release is published only if all three succeed.
# Without signing secrets, macOS builds are ad-hoc signed and Windows builds are unsigned.
on:
  push:
    branches: [main]
  # Re-run by hand from the Actions tab, for example after fixing a failed build.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a queued run sees the release already exists and does nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error title=Tag without a release::The v$version tag exists but has no release. Delete it (git push origin :refs/tags/v$version) and re-run this workflow."
            exit 1
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm test
      - run: pnpm build
      - name: Build installers
        shell: bash
        run: |
          # Secrets that aren't set arrive as empty strings, which electron-builder treats as set
          # (an empty CSC_LINK makes it try to load the project folder as a certificate).
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          args=(${{ matrix.target }} --publish never)
          # With no Developer ID certificate, ad-hoc sign macOS builds. Unsigned Apple Silicon apps
          # fail with "OpenPaste is damaged"; ad-hoc signed ones get the usual Open Anyway prompt.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then args+=(-c.mac.identity=-); fi
          pnpm exec electron-builder "${args[@]}"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: openpaste-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${{ needs.version.outputs.version }}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Creates the tag on the commit that was built.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenPaste ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: artifacts/*
          fail_on_unmatched_files: true
