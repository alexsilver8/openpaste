name: Release

# Push a tag like v1.0.0 to build installers for every platform and attach them to a
# draft GitHub release. The tag must match the version in package.json.
# Without signing secrets, macOS builds are ad-hoc signed and Windows builds are unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump the version, or tag v$version."
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
      - name: Build installers
        shell: bash
        run: |
          args=(${{ matrix.target }} --publish never)
          # With no Developer ID certificate, ad-hoc sign macOS builds. Unsigned Apple Silicon apps
          # fail with "OpenPaste is damaged"; ad-hoc signed ones get the usual Open Anyway prompt.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then args+=(-c.mac.identity=-); fi
          pnpm exec electron-builder "${args[@]}"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: openpaste-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
