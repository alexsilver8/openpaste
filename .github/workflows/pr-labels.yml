name: PR labels

# Labels each pull request from the type in its title (fix → bug, feat → enhancement, …) and
# assigns it to whoever opened it. See scripts/pr-labels.mjs.
#
# pull_request_target runs main's copy of this workflow with write access, so it also works for
# pull requests from forks. It never checks out or runs the pull request's own code.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Quick successive title edits are applied in order instead of racing.
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # The default ref for pull_request_target is main, not the pull request.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - run: node scripts/pr-labels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
